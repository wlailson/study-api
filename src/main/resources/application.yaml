spring:
  application:
    name: study-app

  profiles:
    active:
      - ${APP_PROFILE:test}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

security:
  oauth2:
    client:
      client-id: ${CLIENT_ID:myclientid}
      client-secret: ${CLIENT_SECRET:myclientsecret}
      authorization-grant-types:
        - "password"
        - "refresh_token"

jwt:
  duration: ${JWT_DURATION:86400}
  refresh: ${JWT_REFRESH_DURATION:172800}

cors:
  origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

server:
  port: ${PORT:8080}