spring:
  application:
    name: study-app

  profiles:
    active: ${APP_PROFILE:test}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  data:
    redis:
        host: ${REDIS_HOST:localhost}
        port: ${REDIS_PORT:6379}

  cache:
    redis:
      time-to-live: 60000 # 1 minute in milliseconds

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH0_ISSUER:https://dev-xf8rvjbrsouszs2t.us.auth0.com/}

cors:
  origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

server:
  port: ${PORT:8081}