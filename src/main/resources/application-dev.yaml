spring:
  datasource:
    url: postgresql://localhost:5432/namedb
    username: postgres
    password: 1234567
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cache:
    redis:
      time-to-live: 60000 # 1 minute in milliseconds